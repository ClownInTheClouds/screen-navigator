plugins {
    id 'publish-plugin' version '2.0.0' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'publish-plugin'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
        withJavadocJar()
    }
}